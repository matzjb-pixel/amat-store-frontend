<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amat Store - Top Up Game Auto</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; padding-bottom: 50px; }
        
        /* Header Navigation */
        header { background-color: var(--bg-card); padding: 15px 20px; text-align: center; border-bottom: 2px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        header h1 { font-size: 24px; font-weight: bold; color: var(--text-main); margin: 0; letter-spacing: 1px; }
        header h1 span { color: var(--primary); }

        /* Container Content */
        .container { max-width: 500px; margin: 30px auto; padding: 0 15px; }
        
        /* Card UI */
        .card { background-color: var(--bg-card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; align-items: center; gap: 8px;}
        .card-title .number { background: var(--primary); color: white; width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;}

        /* Form Input */
        label { font-size: 14px; color: var(--text-muted); margin-bottom: 5px; display: block; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background-color: #0b1120; color: var(--text-main); margin-bottom: 15px; font-size: 14px; transition: border 0.3s; }
        select:focus, input:focus { border-color: var(--primary); outline: none; }
        
        /* Grid untuk 2 Kolom ID */
        .id-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* Button Checkout */
        .btn-submit { width: 100%; background-color: var(--primary); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.3s; margin-top: 5px; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3); }
        .btn-submit:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-submit:disabled { background-color: var(--text-muted); cursor: not-allowed; transform: translateY(0); box-shadow: none; }

        /* Kotak Hasil Transaksi */
        #hasil-transaksi { display: none; margin-top: 25px; padding: 20px; background: #0f172a; border-radius: 12px; border: 1px solid #38bdf8; }
        #hasil-transaksi h4 { margin: 0 0 10px 0; color: #38bdf8; font-size: 16px;}
        #hasil-transaksi p { margin: 5px 0; font-size: 14px; color: #cbd5e1; }
        
        .status-badge { font-weight: bold; padding: 6px 12px; border-radius: 6px; display: inline-block; margin-top: 8px;}
        .status-failed { background-color: #ef4444; color: white; }
        .status-success { background-color: #10b981; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>Amat<span>Store</span></h1>
    </header>

    <div class="container">
        <!-- Bagian 1: Pilih Produk -->
        <div class="card">
            <div class="card-title">
                <span class="number">1</span> Pilih Produk
            </div>
            <label>Menu Layanan:</label>
                        <select id="service_code">
                <!-- Kategori: Pass & Membership -->
                <option value="MLGLOBAL16642-S14">Weekly Diamond Pass</option>
                <option value="MLGLOBAL33-S14">Twilight Pass</option>

                <!-- Kategori: Diamond Reguler & Promo First Top Up -->
                <option value="MLGLOBAL22590-S14">55 Diamonds (Promo First Top Up)</option>
                <option value="MLGLOBAL13-S14">86 Diamonds</option>
                <option value="MLGLOBAL22591-S14">165 Diamonds (Promo First Top Up)</option>
                <option value="MLGLOBAL23-S14">172 Diamonds</option>
                <option value="MLGLOBAL25-S14">257 Diamonds</option>
                <option value="MLGLOBAL22592-S14">275 Diamonds (Promo First Top Up)</option>
                <option value="MLGLOBAL22593-S14">565 Diamonds (Promo First Top Up)</option>
                <option value="MLGLOBAL26-S14">706 Diamonds</option>
                <option value="MLGLOBAL27-S14">2195 Diamonds</option>
                <option value="MLGLOBAL28-S14">3688 Diamonds</option>
                <option value="MLGLOBAL29-S14">5532 Diamonds</option>
                <option value="MLGLOBAL30-S14">9288 Diamonds</option>

                <!-- Batas untuk produk game lain nanti -->
                <option disabled>──────────────────────</option>
                <option value="FF-CONTOH" disabled>Free Fire (Segera Hadir)</option>
                <option value="PULSA-CONTOH" disabled>Pulsa All Operator (Segera Hadir)</option>
            </select>

        </div>

        <!-- Bagian 2: Masukkan Data -->
        <div class="card">
            <div class="card-title">
                <span class="number">2</span> Masukkan Target Tujuan
            </div>
            <div class="id-grid">
                <div>
                    <label>User ID</label>
                    <input type="number" id="userId" placeholder="Cth: 12345678" required>
                </div>
                <div>
                    <label>Zone ID</label>
                    <input type="number" id="zoneId" placeholder="Cth: 1234" required>
                </div>
            </div>
        </div>

        <!-- Tombol Beli -->
        <button class="btn-submit" id="btn-beli" onclick="lakukanTransaksi()">Beli Sekarang</button>

        <!-- Kotak Hasil Transaksi (Sembunyi sebelum ditekan) -->
        <div id="hasil-transaksi">
            <h4>🧾 Struk Transaksi</h4>
            <p id="info-target"></p>
            <p id="info-pesan"></p>
            <div id="info-status" class="status-badge"></div>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT (Mesinnya) -->
    <script>
        async function lakukanTransaksi() {
            const service_code = document.getElementById('service_code').value;
            const userId = document.getElementById('userId').value;
            const zoneId = document.getElementById('zoneId').value;
            const btnBeli = document.getElementById('btn-beli');

            if (!userId || !zoneId) {
                alert("Harap isi User ID dan Zone ID!");
                return;
            }

            // Bikin tombol loading & gak bisa diklik 2x
            btnBeli.innerHTML = "Memproses Pesanan...";
            btnBeli.disabled = true;

            try {
                // Nembak ke Backend Vercel
                const response = await fetch('https://amat-store-backend.vercel.app/api/transaksi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        service_code: service_code, 
                        target: userId, 
                        zone: zoneId 
                    })
                });

                const data = await response.json();

                // Nampilin Kotak Hasil
                const box = document.getElementById('hasil-transaksi');
                box.style.display = 'block';
                
                document.getElementById('info-target').innerText = 'ID Tujuan : ' + userId + ' (' + zoneId + ')';
                document.getElementById('info-pesan').innerText = 'Keterangan : ' + (data.message || 'Transaksi sedang diproses...');
                
                // Nampilin warna status Merah (Gagal) atau Hijau (Sukses)
                const statusEl = document.getElementById('info-status');
                statusEl.innerText = 'Status: ' + (data.status_transaksi || 'SUCCESS');
                
                if(data.status_transaksi === 'FAILED') {
                    statusEl.className = 'status-badge status-failed';
                } else {
                    statusEl.className = 'status-badge status-success';
                }

            } catch (err) {
                alert('Gagal terhubung ke server.');
            } finally {
                // Balikin tombol jadi semula
                btnBeli.innerHTML = "Beli Sekarang";
                btnBeli.disabled = false;
            }
        }
    </script>
</body>
</html>
