<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amat Store</title>
</head>
<body>
    <h1>Amat Store</h1>
    <div>
        <label>Pilih Produk:</label><br>
        <select id="service_code">
            <option value="ml-50">Mobile Legends 50 Diamond</option>
            <option value="telkomsel-10k">Pulsa Telkomsel 10.000</option>
        </select>
    </div>
    <br>
    <div>
        <label>Nomor Tujuan / ID:</label><br>
        <input type="text" id="target" placeholder="Masukkan Nomor atau ID">
    </div>
    <br>
    <button onclick="lakukanTransaksi()">Beli Sekarang</button>
    <p id="status"></p>

    <script>
        async function lakukanTransaksi() {
            const service_code = document.getElementById('service_code').value;
            const target = document.getElementById('target').value;
            document.getElementById('status').innerText = "Memproses...";
            
            try {
                const response = await fetch('https://amat-store-backend.vercel.app/api/transaksi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service_code, target })
                });
                const data = await response.json();
                document.getElementById('status').innerText = "Hasil: " + JSON.stringify(data);
            } catch (err) {
                document.getElementById('status').innerText = "Gagal terhubung ke backend.";
            }
        }
    </script>
</body>
</html>
