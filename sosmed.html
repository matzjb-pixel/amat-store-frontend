<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layanan Sosmed - Amat Store</title>
  <!-- Masukin script Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 30px; }
    
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
    .card { background: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #334155; position: relative; overflow: hidden; }
    
    /* Label Flash Sale Pojok */
    .flash-badge { position: absolute; top: 10px; right: -30px; background: #ef4444; color: white; font-size: 11px; font-weight: bold; padding: 4px 30px; transform: rotate(45deg); display: none; }
    .card.is-flashsale .flash-badge { display: block; }
    
    .title { font-size: 16px; font-weight: bold; margin-bottom: 10px; line-height: 1.3; }
    .id-badge { display: inline-block; background: #334155; font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-bottom: 10px; color: #94a3b8; }
    
    /* Harga Area */
    .price-area { margin: 15px 0; }
    .normal-price { font-size: 18px; font-weight: bold; color: #4ade80; }
    .harga-coret { text-decoration: line-through; color: #94a3b8; font-size: 13px; display: block; margin-bottom: 2px; }
    .flash-price { font-size: 20px; font-weight: bold; color: #facc15; }
    
    /* Tombol Beli */
    .btn-buy { display: block; width: 100%; text-align: center; background: #2563eb; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px; border: none; cursor: pointer; transition: 0.3s; }
    .btn-buy:hover { background: #1d4ed8; }
    
    /* Tombol Habis */
    .btn-habis { background: #475569; cursor: not-allowed; color: #94a3b8; }
    .btn-habis:hover { background: #475569; }
    
    .loading { text-align: center; color: #94a3b8; margin-top: 50px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 Layanan Sosmed Termurah</h1>
    
    <div id="loading" class="loading">Memuat produk dari server... ⏳</div>
    <div id="productGrid" class="product-grid"></div>
  </div>

  <script>
    // Koneksi Supabase 
    const SUPABASE_URL = 'https://ljrjweuweronwvdbjylq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ObJ9CIFo3kHHrJ1KZgbeTQ_eKBFrz9a';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Format Rupiah
    const formatRp = (angka) => {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    };

    // Format Pesan WhatsApp (Nomor WA Lu Udah Dipasang)
    const generateWA = (nama, harga, id) => {
      const text = `Halo Admin Amat Store, saya mau order:\n\n*Nama Layanan:* ${nama}\n*ID Layanan:* ${id}\n*Harga:* ${harga}\n\nMohon dibantu proses ya!`;
      return `https://wa.me/6285705526857?text=${encodeURIComponent(text)}`;
    };

    async function loadProductsToFront() {
      const grid = document.getElementById('productGrid');
      const loading = document.getElementById('loading');
      
      const { data, error } = await supabaseClient.from('product_stocks').select('*').order('product_id', { ascending: true });
      
      if (error) {
        loading.innerHTML = '❌ Gagal memuat produk. Coba refresh.';
        return;
      }
      
      loading.style.display = 'none';
      let html = '';

      data.forEach(item => {
        // Logika Harga
        let priceDisplay = '';
        let finalPriceText = '';
        
        if (item.is_flashsale && item.flashsale_price > 0) {
          priceDisplay = `
            <span class="harga-coret">${formatRp(item.price)}</span>
            <span class="flash-price">${formatRp(item.flashsale_price)} 🔥</span>
          `;
          finalPriceText = formatRp(item.flashsale_price);
        } else {
          priceDisplay = `<span class="normal-price">${formatRp(item.price)}</span>`;
          finalPriceText = formatRp(item.price);
        }

        // Logika Stok
        let btnDisplay = '';
        if (item.is_available) {
          btnDisplay = `<a href="${generateWA(item.product_name, finalPriceText, item.product_id)}" class="btn-buy" target="_blank">🛒 Beli Sekarang</a>`;
        } else {
          btnDisplay = `<button class="btn-buy btn-habis" disabled>❌ Stok Habis</button>`;
        }

        html += `
          <div class="card ${item.is_flashsale ? 'is-flashsale' : ''}">
            <div class="flash-badge">FLASH SALE</div>
            <span class="id-badge">ID: ${item.product_id}</span>
            <div class="title">${item.product_name}</div>
            
            <div class="price-area">
              ${priceDisplay}
            </div>
            
            ${btnDisplay}
          </div>
        `;
      });

      grid.innerHTML = html;
    }

    // Jalankan saat web dibuka
    loadProductsToFront();
  </script>
</body>
</html>
